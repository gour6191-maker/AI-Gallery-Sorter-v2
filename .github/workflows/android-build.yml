
name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AI Gallery Sorter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate and extract Android source ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No source ZIP found in repository root"
            exit 1
          fi

          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          PROJECT_DIR=$(find "$PWD/source" -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android Gradle project not found inside ZIP"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Fix MediaPipe Kotlin API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ["PROJECT_DIR"])
          files = list(root.glob("app/src/main/java/**/MainActivity.kt"))

          if not files:
              raise SystemExit("MainActivity.kt not found")

          p = files[0]
          s = p.read_text()

          s = s.replace(
              "import com.google.mediapipe.tasks.vision.imageembedder.ImageEmbedderOptions\n",
              ""
          )

          s = s.replace(
              "ImageEmbedderOptions.builder()",
              "ImageEmbedder.ImageEmbedderOptions.builder()"
          )

          s = s.replace(
              ".build()).embeddings().first().floatEmbedding()",
              ".build()).embeddingResult().embeddings().first().floatEmbedding()"
          )

          s = s.replace(
              "inPreferredConfig = Bitmap.Config.RGB_565",
              "inPreferredConfig = Bitmap.Config.ARGB_8888"
          )

          p.write_text(s)
          print("Applied compatibility fixes to", p)
          PY

      - name: Build debug APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Gallery-Sorter-v2-debug
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
          
